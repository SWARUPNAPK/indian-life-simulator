name: Build Android debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Make sure www folder exists
        run: |
          mkdir -p www
          if [ ! -f www/index.html ] && [ -f index.html ]; then cp index.html www/index.html; fi
          if [ ! -f www/game.js ] && [ -f game.js ]; then cp game.js www/game.js; fi
          ls -la www
          test -f www/index.html && test -f www/game.js
      - run: npm install
      - run: test -d android || npx cap add android
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: indian-life-simulator-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
