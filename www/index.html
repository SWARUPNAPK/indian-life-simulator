<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#FF9933">
<title>Indian Life Simulator</title>
<style>
:root{--bg:#fff8ef;--card:#ffffff;--ink:#1f2430;--mute:#6b7280;--saf:#FF9933;--grn:#138808;--navy:#1c2a6b;--red:#c62828;--line:#eadfce;--chip:#fff1de}
@media (prefers-color-scheme:dark){:root{--bg:#14161c;--card:#1e222b;--ink:#f1f3f7;--mute:#9aa3b2;--line:#2c313c;--chip:#2a2f3a;--navy:#8fa0ff}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Devanagari","Noto Sans Bengali",sans-serif;font-size:15px;overscroll-behavior:none}
#app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto;padding-top:env(safe-area-inset-top)}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:linear-gradient(90deg,var(--saf),#ffb766);color:#201400;font-weight:700}
header small{font-weight:500;opacity:.8}
header button{background:rgba(255,255,255,.55);border:0;border-radius:10px;padding:6px 10px;font-size:16px}
main{flex:1;overflow-y:auto;padding:12px 12px 16px;-webkit-overflow-scrolling:touch}
nav{display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;color:var(--mute);padding:8px 0 7px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:20px}
nav button.on{color:var(--grn);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.card h3{margin:0 0 8px;font-size:15px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.wrap{display:flex;flex-wrap:wrap;gap:6px}
.mute{color:var(--mute);font-size:12.5px}
.btn{border:0;border-radius:11px;padding:10px 12px;background:var(--chip);color:var(--ink);font-size:14px;font-weight:600}
.btn.pri{background:var(--grn);color:#fff}
.btn.saf{background:var(--saf);color:#201400}
.btn.red{background:var(--red);color:#fff}
.btn.sel{outline:2px solid var(--grn)}
.btn:disabled{opacity:.4}
.btn.big{width:100%;padding:14px;font-size:16px}
.bar{height:9px;background:var(--chip);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%}
.stat{margin-bottom:7px}.stat .row{font-size:12.5px;margin-bottom:2px}
.avatar{font-size:54px;line-height:1}
.chip{display:inline-block;background:var(--chip);border-radius:20px;padding:3px 9px;font-size:12px}
.pos{color:var(--grn)}.neg{color:var(--red)}
.tbl{width:100%;font-size:13.5px;border-collapse:collapse}.tbl td{padding:3px 0}.tbl td:last-child{text-align:right}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:88%;overflow-y:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet h2{margin:0 0 6px;font-size:18px}
.choice{display:block;width:100%;text-align:left;margin-top:8px}
.choice small{display:block;font-weight:400;color:var(--mute);margin-top:2px}
input,select{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:15px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.trophy{opacity:.35;text-align:center;font-size:12px;padding:8px;border:1px dashed var(--line);border-radius:12px}.trophy.got{opacity:1;border-style:solid;background:var(--chip)}.trophy b{display:block;font-size:26px}
.hero{text-align:center;padding:20px 8px}.hero h1{margin:6px 0;font-size:26px;color:var(--navy)}
</style>
</head>
<body>
<div id="app"></div>
<script src="game.js"></script>
</body>
</html>
